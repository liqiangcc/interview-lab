name: 校验 SourceNote Issue

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  contents: read
  issues: read

jobs:
  validate:
    # bulk reconciliation 在写入前逐条执行同一个 SourceNote validator；
    # 移除 migration:xhs-bulk 后，unlabeled 事件恢复普通 live validation。
    if: ${{ !contains(github.event.issue.labels.*.name, 'migration:xhs-bulk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验 SourceNote projection
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t labels < <(jq -r '.issue.labels[].name' "$GITHUB_EVENT_PATH")
          if ! printf '%s\n' "${labels[@]}" | grep -Fxq 'type:source-note'; then
            echo '不是 SourceNote Issue，跳过。'
            exit 0
          fi

          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > /tmp/source-note-issue.md
          state="$(jq -r '.issue.state' "$GITHUB_EVENT_PATH")"
          args=()
          for label in "${labels[@]}"; do
            args+=(--label "$label")
          done
          node scripts/validate-source-note-issue.js \
            /tmp/source-note-issue.md \
            --state "$state" \
            "${args[@]}"
