name: 同步 Issue Labels

on:
  push:
    branches: [main]
    paths:
      - 'config/issue-labels.json'
      - 'scripts/reconcile-labels.sh'
      - '.github/workflows/reconcile-labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 同步 Label taxonomy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/reconcile-labels.sh
