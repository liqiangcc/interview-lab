name: 校验 InterviewNote Issue

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  contents: read
  issues: read

jobs:
  validate:
    # 全量 XHS intake 在写入前已经逐条通过同一个 InterviewNote validator。
    # 临时 bulk label 只用于避免 opened 时为上千条已预检记录重复占用 runner。
    # 进入 Source review 时先移除 migration:xhs-bulk；unlabeled 事件随即恢复普通 live validation。
    if: ${{ !contains(github.event.issue.labels.*.name, 'migration:xhs-bulk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验 InterviewNote projection
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t labels < <(jq -r '.issue.labels[].name' "$GITHUB_EVENT_PATH")
          if ! printf '%s\n' "${labels[@]}" | grep -Fxq 'type:interview-note'; then
            echo '不是 InterviewNote Issue，跳过。'
            exit 0
          fi

          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > /tmp/interview-note-issue.md
          state="$(jq -r '.issue.state' "$GITHUB_EVENT_PATH")"
          args=()
          for label in "${labels[@]}"; do
            args+=(--label "$label")
          done
          node scripts/validate-interview-note-issue.js \
            /tmp/interview-note-issue.md \
            --state "$state" \
            "${args[@]}"
