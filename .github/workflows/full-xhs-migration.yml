name: 全量迁移 XHS InterviewNote

on:
  push:
    branches:
      - 'ops/full-xhs-migration-*'
    paths:
      - 'ops/full-xhs-migration.dry-run'
      - 'ops/full-xhs-migration.apply'

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout interview-lab
        uses: actions/checkout@v4

      - name: Resolve pinned migration config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          echo "source_ref=$(jq -r '.source_ref' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          echo "source_repository=$(jq -r '.source_repository' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          echo "target_repository=$(jq -r '.target_repository' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          if [[ -f ops/full-xhs-migration.apply ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout fixed XHS snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.source_repository }}
          ref: ${{ steps.config.outputs.source_ref }}
          path: xhs
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preflight / migrate in source publication order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --source-root xhs
            --source-ref "${{ steps.config.outputs.source_ref }}"
            --target-repo "${{ steps.config.outputs.target_repository }}"
            --report xhs-full-migration-report.json
          )
          if [[ "${{ steps.config.outputs.apply }}" == "true" ]]; then
            args+=(--apply)
          fi
          node scripts/migrate-xhs-all.js "${args[@]}"

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-full-migration-report-${{ github.run_id }}
          path: xhs-full-migration-report.json
          if-no-files-found: warn
          retention-days: 7
