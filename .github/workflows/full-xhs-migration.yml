name: 全量迁移 XHS InterviewNote

on:
  push:
    branches:
      - 'ops/full-xhs-migration-*'
    paths:
      - 'ops/full-xhs-migration.dry-run'
      - 'ops/full-xhs-migration.apply'

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout interview-lab
        uses: actions/checkout@v4

      - name: Resolve pinned migration config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          echo "source_ref=$(jq -r '.source_ref' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          echo "source_repository=$(jq -r '.source_repository' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          echo "target_repository=$(jq -r '.target_repository' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          if [[ -f ops/full-xhs-migration.apply ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout fixed XHS snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.source_repository }}
          ref: ${{ steps.config.outputs.source_ref }}
          path: xhs
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for hourly content-creation window
        if: steps.config.outputs.apply == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ steps.config.outputs.target_repository }}
        run: |
          set -euo pipefail
          latest_created_at="$(
            gh api -X GET "repos/${TARGET_REPO}/issues" \
              -f labels='migration:xhs-bulk' \
              -f state='all' \
              -f sort='created' \
              -f direction='desc' \
              -f per_page=1 \
              --jq '.[0].created_at // empty'
          )"

          if [[ -z "$latest_created_at" ]]; then
            echo "No previous bulk Issue found; no hourly-window wait required."
            exit 0
          fi

          latest_epoch="$(date -d "$latest_created_at" +%s)"
          now_epoch="$(date -u +%s)"
          safe_epoch="$((latest_epoch + 3700))"

          echo "Latest bulk Issue created_at: $latest_created_at"
          echo "Hourly safety boundary: $(date -u -d "@$safe_epoch" +'%Y-%m-%dT%H:%M:%SZ')"

          if (( now_epoch < safe_epoch )); then
            wait_seconds="$((safe_epoch - now_epoch))"
            echo "Waiting ${wait_seconds}s so the previous bulk window fully expires."
            sleep "$wait_seconds"
          else
            echo "Previous bulk window already expired; continuing immediately."
          fi

      - name: Preflight / migrate in source publication order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --source-root xhs
            --source-ref "${{ steps.config.outputs.source_ref }}"
            --target-repo "${{ steps.config.outputs.target_repository }}"
            --report xhs-full-migration-report.json
          )
          if [[ "${{ steps.config.outputs.apply }}" == "true" ]]; then
            args+=(--apply)
            # GitHub official secondary content limits are normally 80/minute and 500/hour.
            # Runtime protection:
            # - wait until the latest previous bulk Issue is > 1 hour old (+100s safety margin)
            # - 8 creates / ~9 seconds
            # - max 400 new Issues in this run, leaving hourly headroom
            sed -i 's/const GRAPHQL_BATCH_PAUSE_MS = 1600;/const GRAPHQL_BATCH_PAUSE_MS = 9000;/' scripts/migrate-xhs-all.js
            sed -i 's/const batches = chunk(pending, GRAPHQL_BATCH_SIZE);/const batches = chunk(pending.slice(0, 400), GRAPHQL_BATCH_SIZE);/' scripts/migrate-xhs-all.js
          fi
          node scripts/migrate-xhs-all.js "${args[@]}"

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-full-migration-report-${{ github.run_id }}
          path: xhs-full-migration-report.json
          if-no-files-found: warn
          retention-days: 7
