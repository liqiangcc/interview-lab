name: 对账 XHS SourceNote

on:
  push:
    branches:
      - 'ops/xhs-source-note-reconcile-*'
    paths:
      - 'ops/xhs-source-note-reconcile.dry-run'
      - 'ops/xhs-source-note-reconcile.apply'

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout interview-lab
        uses: actions/checkout@v4

      - name: Resolve pinned XHS snapshot
        id: config
        shell: bash
        run: |
          set -euo pipefail
          echo "source_ref=$(jq -r '.source_ref' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          echo "source_repository=$(jq -r '.source_repository' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          echo "target_repository=$(jq -r '.target_repository' config/xhs-full-migration.json)" >> "$GITHUB_OUTPUT"
          if [[ -f ops/xhs-source-note-reconcile.apply ]]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
            safe_after="$(sed -n 's/^safe_after=//p' ops/xhs-source-note-reconcile.apply | tail -n 1)"
            echo "safe_after=${safe_after}" >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'safe_after=' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout fixed XHS snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.source_repository }}
          ref: ${{ steps.config.outputs.source_ref }}
          path: xhs
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for legacy content-creation window
        if: ${{ steps.config.outputs.apply == 'true' && steps.config.outputs.safe_after != '' }}
        shell: bash
        run: |
          set -euo pipefail
          safe_after='${{ steps.config.outputs.safe_after }}'
          safe_epoch="$(date -u -d "$safe_after" +%s)"
          now_epoch="$(date -u +%s)"
          echo "SourceNote apply safety boundary: $safe_after"
          if (( now_epoch < safe_epoch )); then
            wait_seconds="$((safe_epoch - now_epoch))"
            echo "Waiting ${wait_seconds}s for the legacy content-creation window to expire."
            sleep "$wait_seconds"
          else
            echo 'Safety boundary already passed; continuing.'
          fi

      - name: Preflight / reconcile SourceNotes in publication order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --source-root xhs
            --source-ref "${{ steps.config.outputs.source_ref }}"
            --target-repo "${{ steps.config.outputs.target_repository }}"
            --report xhs-source-note-reconciliation-report.json
          )
          if [[ "${{ steps.config.outputs.apply }}" == 'true' ]]; then
            # 100 issue mutations per run, 10 seconds apart.
            # 10s pacing remains below GitHub's normal content-generation secondary limits.
            # Every run reloads live SourceNote / legacy markers before planning.
            args+=(--apply --max-mutations 100 --pause-ms 10000)
          fi
          node scripts/reconcile-xhs-source-notes.js "${args[@]}"

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-source-note-reconciliation-${{ github.run_id }}
          path: xhs-source-note-reconciliation-report.json
          if-no-files-found: warn
          retention-days: 14
