name: 导出 Pilot #3 原图

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-pilot3-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 XHS 来源仓库
        uses: actions/checkout@v4
        with:
          repository: liqiangcc/xhs
          ref: master
          path: xhs

      - name: 校验原图 artifact
        shell: bash
        run: |
          set -euo pipefail
          image='xhs/downloaded_images/6508552c000000001303f499/1.webp'
          test -s "$image"
          file "$image"
          stat -c 'size=%s' "$image"
          git -C xhs hash-object 'downloaded_images/6508552c000000001303f499/1.webp'
          sha256sum "$image"

      - name: 上传原图供独立 fidelity review
        uses: actions/upload-artifact@v4
        with:
          name: pilot3-raw-image
          path: xhs/downloaded_images/6508552c000000001303f499/1.webp
          if-no-files-found: error
          retention-days: 1
